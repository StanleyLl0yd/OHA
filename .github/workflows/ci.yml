name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py
      - name: Install Rust 1.89.0
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.89.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: Cross-language C ABI smoke
        run: python3 scripts/ffi_ctypes_smoke.py

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py
      - name: Test pure-Python harness
        run: python3 -m unittest discover -s tests -v
      - name: Verify MPL-2.0 source policy
        run: python3 scripts/verify_license_policy.py
      - name: Python syntax
        run: python3 -m compileall -q tools tests scripts

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          show-patched-versions: true

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Semgrep CE
        run: semgrep scan --config p/security-audit --config p/secrets --error --metrics=off .

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  winui:
    name: Windows WinUI 3 native build
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check supply-chain policy
        shell: pwsh
        run: python scripts/verify_ci_supply_chain.py
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Build Rust native library
        shell: pwsh
        run: cargo build -p oha-ffi --locked
      - name: Build WinUI 3 C# application without launching
        shell: pwsh
        run: dotnet build apps/oha-windows/OHA.Windows.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64
      - name: Execute Windows C# to Rust PInvoke smoke
        shell: pwsh
        run: |
          dotnet build apps/oha-windows-ffi-smoke/OHA.FFISmoke.csproj -c Release
          $output = "apps/oha-windows-ffi-smoke/bin/Release/net10.0"
          Copy-Item -LiteralPath "target/debug/oha_ffi.dll" -Destination (Join-Path $output "oha_ffi.dll") -Force
          dotnet (Join-Path $output "OHA.FFISmoke.dll")

  swiftui:
    name: macOS SwiftUI/AppKit native build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py
      - name: Install Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Build Rust native library
        run: cargo build -p oha-ffi --locked
      - name: Compile SwiftUI/AppKit native application
        run: swift build -c release --build-path "$RUNNER_TEMP/oha-native-swift-build"
      - name: Compile and execute Swift foreign-caller smoke
        run: |
          swiftc -import-objc-header include/oha_ffi.h -L target/debug -loha_ffi apps/oha-macos/FFISmoke.swift -o "$RUNNER_TEMP/OHAFFISmoke"
          DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/debug" "$RUNNER_TEMP/OHAFFISmoke"

  verify:
    name: verify
    if: always()
    needs: [rust, python, dependency-review, semgrep, gitleaks, winui, swiftui]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce verification results
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          WINUI_RESULT: ${{ needs.winui.result }}
          SWIFTUI_RESULT: ${{ needs.swiftui.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$RUST_RESULT" = "success"
          test "$PYTHON_RESULT" = "success"
          test "$WINUI_RESULT" = "success"
          test "$SWIFTUI_RESULT" = "success"
          test "$SEMGREP_RESULT" = "success"
          test "$GITLEAKS_RESULT" = "success"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$DEPENDENCY_REVIEW_RESULT" = "success"
          else
            test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
          fi
